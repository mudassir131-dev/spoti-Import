<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Ambient Glow -->
    <radialGradient id="tileGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#2E1065" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#1E1B4B" stop-opacity="0.25" />
      <stop offset="80%" stop-color="#0F172A" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Squircle Tile Gradient -->
    <linearGradient id="squircleBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14151D" />
      <stop offset="50%" stop-color="#0F1017" />
      <stop offset="100%" stop-color="#0A0B10" />
    </linearGradient>

    <linearGradient id="squircleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3142" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#1A1C28" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10121C" stop-opacity="0.5" />
    </linearGradient>

    <!-- Top Orb Spherical Gradient: Gold -> Coral -> Fuchsia -> Royal Blue -> Cyan -->
    <linearGradient id="orbGrad" x1="12%" y1="15%" x2="88%" y2="85%">
      <stop offset="0%" stop-color="#FFBE3B" />
      <stop offset="18%" stop-color="#FF6B2B" />
      <stop offset="42%" stop-color="#F43F85" />
      <stop offset="68%" stop-color="#A855F7" />
      <stop offset="85%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Orb Specular Top-Left Highlight -->
    <linearGradient id="orbSpecular" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="25%" stop-color="#FFE082" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#FF5722" stop-opacity="0" />
    </linearGradient>

    <!-- Crystal Base Shell Body -->
    <linearGradient id="crystalBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1338" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#130F26" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0D091A" stop-opacity="0.98" />
    </linearGradient>

    <!-- Left Fiery Coral Neon Rim -->
    <linearGradient id="leftNeonRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="30%" stop-color="#FF3366" />
      <stop offset="70%" stop-color="#E040FB" />
      <stop offset="100%" stop-color="#7C4DFF" />
    </linearGradient>

    <!-- Right Cyan / Electric Blue Neon Rim -->
    <linearGradient id="rightNeonRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="40%" stop-color="#0091FF" />
      <stop offset="80%" stop-color="#7C4DFF" />
      <stop offset="100%" stop-color="#FF2E93" />
    </linearGradient>

    <!-- Top Crown Golden Arc Rim -->
    <linearGradient id="topCrownRim" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFA000" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#FFE57F" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FF6D00" stop-opacity="0.3" />
    </linearGradient>

    <!-- Acoustic Wave 1 (Upper) -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E879F9" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Acoustic Wave 2 (Lower) -->
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="60%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Arrow Ribbon Stem: Amber Gold into Hot Pink -->
    <linearGradient id="arrowStemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="40%" stop-color="#FF9100" />
      <stop offset="100%" stop-color="#FF1744" />
    </linearGradient>

    <!-- Arrow Head Body Gradient: Sunset Coral -> Neon Magenta -> Violet -->
    <linearGradient id="arrowHeadGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FF6E40" />
      <stop offset="35%" stop-color="#F50057" />
      <stop offset="70%" stop-color="#D500F9" />
      <stop offset="100%" stop-color="#7C4DFF" />
    </linearGradient>

    <!-- Arrow Neon Outline -->
    <linearGradient id="arrowOutlineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3E0" />
      <stop offset="50%" stop-color="#FF4081" />
      <stop offset="100%" stop-color="#E040FB" />
    </linearGradient>

    <!-- Filters for Neon Luminosity -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intenseNeon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Deep Black Canvas -->
  <rect width="512" height="512" fill="#000000" />

  <!-- App Icon Squircle Container -->
  <g filter="url(#tileShadow)">
    <rect x="52" y="32" width="408" height="408" rx="98" fill="url(#squircleBg)" stroke="url(#squircleBorder)" stroke-width="2" />
    <!-- Ambient Internal Nebula Glow -->
    <rect x="52" y="32" width="408" height="408" rx="98" fill="url(#tileGlow)" />
  </g>

  <!-- ================= CRYSTAL GEMSTONE SILHOUETTE ================= -->
  <!-- Outer Translucent Faceted Crystal Hull -->
  <path d="M 256 78
           C 290 78, 350 102, 368 132
           C 378 148, 372 268, 362 292
           C 350 320, 290 366, 256 370
           C 222 366, 162 320, 150 292
           C 140 268, 134 148, 144 132
           C 162 102, 222 78, 256 78 Z"
        fill="url(#crystalBodyGrad)" />

  <!-- Ambient Internal Glass Backlight Shadow -->
  <path d="M 160 160 C 240 100, 320 100, 352 160 C 370 230, 340 310, 256 345 C 172 310, 142 230, 160 160 Z"
        fill="#090A14" />

  <!-- ================= TOP CIRCULAR GRADIENT DOME ================= -->
  <!-- Circular Vibrant Gradient Disc (Gold -> Red -> Magenta -> Blue) -->
  <g id="topGradientDome">
    <circle cx="256" cy="186" r="102" fill="url(#orbGrad)" />

    <!-- Specular Convex Glass Crescent Reflection on Top Rim -->
    <path d="M 174 150
             C 192 110, 230 92, 275 92
             C 310 92, 340 105, 354 132
             C 334 116, 295 106, 260 106
             C 215 106, 185 125, 174 150 Z"
          fill="url(#orbSpecular)" />
  </g>

  <!-- ================= SCULPTED 3D CRESCENT SLOT / FOLD ================= -->
  <!-- Dark Deep Horizon Crevice curving beneath the dome -->
  <path d="M 158 190
           C 185 228, 240 252, 325 242
           C 340 240, 354 235, 362 228
           C 358 250, 335 272, 305 282
           C 255 298, 195 275, 160 226
           C 154 218, 153 205, 158 190 Z"
        fill="#0A0618" />

  <!-- Deep Shadow Under-curve Lip -->
  <path d="M 162 195
           C 205 240, 270 255, 325 242
           C 270 262, 195 246, 162 195 Z"
        fill="#05030D" />

  <!-- ================= SPOTIFY SOUND WAVE RIBS ================= -->
  <!-- Wave Rib 1 (Upper Lavender/Fuchsia Curved Bar) -->
  <g filter="url(#neonBlur)">
    <path d="M 152 238
             C 180 232, 218 248, 238 274
             C 244 282, 236 295, 225 292
             C 205 272, 175 258, 150 258
             C 142 258, 144 240, 152 238 Z"
          fill="url(#waveGrad1)" />

    <!-- Wave Rib 2 (Lower Violet/Blue Curved Bar) -->
    <path d="M 150 278
             C 178 274, 208 288, 224 312
             C 229 320, 221 332, 212 329
             C 196 312, 172 300, 148 300
             C 140 300, 142 280, 150 278 Z"
          fill="url(#waveGrad2)" />
  </g>

  <!-- ================= NEON FACETED CONTOUR EDGES ================= -->
  <!-- Left Hot Coral/Neon Pink Sweeping Rim Flare -->
  <g filter="url(#intenseNeon)">
    <!-- Thin Core Flare -->
    <path d="M 215 88
             C 170 108, 142 142, 140 190
             C 138 245, 152 288, 185 328
             C 205 352, 230 368, 252 372"
          fill="none"
          stroke="url(#leftNeonRim)"
          stroke-width="3.5"
          stroke-linecap="round" />
  </g>

  <!-- Hot Coral Left Crest Glow Accent -->
  <path d="M 160 160
           C 148 190, 152 240, 175 285"
        fill="none"
        stroke="#FF3366"
        stroke-width="1.8"
        stroke-linecap="round"
        opacity="0.8" />

  <!-- Right Electric Cyan / Azure Rim Highlight -->
  <g filter="url(#neonBlur)">
    <path d="M 355 138
             C 368 160, 368 200, 362 235
             C 356 268, 335 305, 300 338"
          fill="none"
          stroke="url(#rightNeonRim)"
          stroke-width="3"
          stroke-linecap="round" />
  </g>

  <!-- Top Crown Golden Horizon Rim Flare -->
  <path d="M 205 85
           C 230 76, 280 76, 305 85"
        fill="none"
        stroke="url(#topCrownRim)"
        stroke-width="3"
        stroke-linecap="round"
        filter="url(#neonBlur)" />

  <!-- ================= IMPORT DOWNWARD ARROW ================= -->
  <!-- Angled Golden Ribbon Stem dipping down into the arrowhead -->
  <g id="importArrowGroup" filter="url(#intenseNeon)">
    <!-- Golden Curved Stem -->
    <path d="M 285 258
             C 305 264, 325 278, 332 295
             L 332 312
             C 328 300, 310 285, 292 278 Z"
          fill="url(#arrowStemGrad)" />

    <!-- Stem Glow Spine -->
    <path d="M 288 260 C 310 270, 328 288, 332 308"
          fill="none"
          stroke="#FFE082"
          stroke-width="2"
          stroke-linecap="round" />

    <!-- Downward Arrowhead -->
    <!-- Pointing directly down with faceted crystal finish -->
    <path d="M 298 312
             L 366 312
             L 332 366
             Z"
          fill="url(#arrowHeadGrad)"
          stroke="url(#arrowOutlineGrad)"
          stroke-width="2.5"
          stroke-linejoin="round" />

    <!-- Arrow Internal Faceted Highlight Centerline -->
    <path d="M 332 314 L 332 362"
          stroke="#FFFFFF"
          stroke-width="2"
          stroke-linecap="round"
          opacity="0.8" />

    <!-- Specular Left Arrow Bevel Highlight -->
    <path d="M 304 316 L 332 360"
          stroke="#FFE0B2"
          stroke-width="1.2"
          stroke-linecap="round"
          opacity="0.6" />
  </g>
</svg>
